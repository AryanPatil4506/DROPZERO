# Embedding benchmark data for scripts/embedding_benchmark.py.
#
# HONESTY NOTE: AI-assisted, written in creator-style language. Small
# (40 items) and not drawn from real transcripts, so it ranks models and gives *provisional*
# thresholds only. Replace/extend with sentences from real creator transcripts when available.
#
# Each item: an anchor statement, a `repeat` (same point, reworded: should score HIGH), and a
# `progress` (same topic, genuinely new information: should score LOWER). Unrelated pairs are
# formed automatically from anchors of other items in the same group.
#
# Groups: en, hi (Devanagari Hindi), hinglish_roman, hinglish_deva (Hinglish as Whisper often
# writes it, in Devanagari), cross (anchor English, repeat/progress Hinglish).

en:
  - anchor: "An agent is a program that uses a language model to decide its next step and then calls a tool."
    repeat: "Basically, an agent is just a model that picks the next action and uses a tool to do it."
    progress: "I wrote the agent loop myself in about 150 lines of Python over one afternoon."
  - anchor: "The battery lasted a full day with heavy use, around seven hours of screen time."
    repeat: "Even with heavy use I got through the whole day, roughly seven hours of screen on time."
    progress: "Charging from zero to full takes about forty minutes with the bundled charger."
  - anchor: "Compound interest means you earn interest on your interest, not just on what you put in."
    repeat: "So the idea is that your interest itself starts earning interest over time."
    progress: "If you start investing at twenty five instead of thirty five, the final amount almost doubles."
  - anchor: "The main reason the bread was dense is that the dough did not rise long enough."
    repeat: "Again, it came out heavy because I didn't give the dough enough time to rise."
    progress: "Next time I will add a little sugar to feed the yeast and keep the bowl somewhere warm."
  - anchor: "Photosynthesis is how plants turn sunlight, water and carbon dioxide into sugar."
    repeat: "Plants basically use light, water and CO2 to make their own food, that's photosynthesis."
    progress: "The oxygen we breathe is released as a by-product when water molecules are split."
  - anchor: "We reached the summit just before sunrise after hiking for six hours in the dark."
    repeat: "After six hours walking in the dark, we got to the top right before the sun came up."
    progress: "The descent was harder than the climb because the path was covered in loose gravel."
  - anchor: "This laptop throttles under load, so the performance drops after a few minutes of gaming."
    repeat: "Like I said, once you game for a few minutes it gets hot and the speed falls off."
    progress: "Undervolting the CPU fixed most of the throttling and kept temperatures under eighty degrees."
  - anchor: "The trick to remembering formulas is to understand where they come from instead of memorising them."
    repeat: "Don't just mug up formulas; if you know how they are derived you won't forget them."
    progress: "Let's derive the area of a circle by cutting it into thin triangles."
  - anchor: "The camera struggles in low light; photos come out noisy and blurry at night."
    repeat: "At night this camera really isn't great, everything looks grainy and soft."
    progress: "In daylight the colours are accurate and the dynamic range is surprisingly good."
  - anchor: "The form kept failing because the model typed the date in the wrong format."
    repeat: "The booking broke since the date was being entered in a format the site didn't accept."
    progress: "After adding one example of the correct date format, nine out of ten bookings worked."

hi:
  - anchor: "दूध को पहले उबालना ज़रूरी है क्योंकि इससे बैक्टीरिया खत्म हो जाते हैं।"
    repeat: "एक बार फिर बता दूं, उबालने से दूध के कीटाणु मर जाते हैं, इसलिए पहले उबालें।"
    progress: "अब दूध को गुनगुना होने तक ठंडा कीजिए और उसमें दो चम्मच जामन डालिए।"
  - anchor: "चक्रवृद्धि ब्याज में आपको ब्याज पर भी ब्याज मिलता है।"
    repeat: "मतलब आपका ब्याज भी आगे चलकर और ब्याज कमाने लगता है।"
    progress: "अगर आप पच्चीस की उम्र में निवेश शुरू करें तो रकम लगभग दोगुनी हो सकती है।"
  - anchor: "प्रकाश संश्लेषण में पौधे धूप, पानी और कार्बन डाइऑक्साइड से भोजन बनाते हैं।"
    repeat: "यानी पौधे सूरज की रोशनी और पानी की मदद से अपना खाना खुद बनाते हैं।"
    progress: "इस प्रक्रिया में ऑक्सीजन बाहर निकलती है जिसे हम सांस में लेते हैं।"
  - anchor: "इस फोन की बैटरी पूरे दिन चलती है, लगभग सात घंटे स्क्रीन टाइम के साथ।"
    repeat: "भारी इस्तेमाल में भी बैटरी आराम से एक दिन निकाल देती है।"
    progress: "फोन को फुल चार्ज होने में करीब चालीस मिनट लगते हैं।"
  - anchor: "रोटी सख्त इसलिए बनी क्योंकि आटा ठीक से गूंधा नहीं गया था।"
    repeat: "फिर से कहूं तो आटा अच्छी तरह न गूंधने की वजह से रोटी कड़ी हो गई।"
    progress: "आटे में थोड़ा गुनगुना पानी और एक चम्मच तेल डालने से रोटी नरम बनती है।"
  - anchor: "सुबह जल्दी उठने से पढ़ाई के लिए शांत समय मिल जाता है।"
    repeat: "जल्दी उठोगे तो पढ़ने के लिए बिना शोर वाला समय मिलेगा।"
    progress: "मैं हर पच्चीस मिनट पढ़ने के बाद पांच मिनट का ब्रेक लेता हूं।"
  - anchor: "हम सूरज निकलने से ठीक पहले पहाड़ की चोटी पर पहुंच गए।"
    repeat: "सूर्योदय से कुछ मिनट पहले ही हम ऊपर टॉप पर पहुंच चुके थे।"
    progress: "नीचे उतरते समय रास्ता फिसलन भरा था और हमें दो घंटे ज़्यादा लगे।"
  - anchor: "फॉर्मूले रटने के बजाय समझिए कि वे कहां से आते हैं।"
    repeat: "सूत्र याद मत कीजिए, उनका आधार समझ लेंगे तो कभी नहीं भूलेंगे।"
    progress: "चलिए वृत्त का क्षेत्रफल छोटे त्रिभुजों में काटकर निकालते हैं।"
  - anchor: "रात में इस कैमरे की फोटो धुंधली और दानेदार आती है।"
    repeat: "कम रोशनी में ये कैमरा अच्छा नहीं है, तस्वीरों में बहुत नॉइज़ आता है।"
    progress: "दिन की रोशनी में रंग बिल्कुल असली दिखते हैं।"
  - anchor: "दही जमने में गर्मियों में छह घंटे और सर्दियों में आठ से दस घंटे लगते हैं।"
    repeat: "गर्मी में दही करीब छह घंटे में जम जाता है, ठंड में दस घंटे तक लग सकते हैं।"
    progress: "जमने के बाद दही को तुरंत फ्रिज में रखिए ताकि वो खट्टा न हो।"

hinglish_roman:
  - anchor: "Daylight mein teeno phones ki photos kaafi achhi aati hain, colors natural hain."
    repeat: "Yaar din mein toh teeno phones achhi photo lete hain, colors bhi natural lagte hain."
    progress: "Low light mein pehle phone ki photo mein bahut zyada noise aata hai."
  - anchor: "Agent basically ek program hai jo language model se decide karta hai ki next step kya hoga."
    repeat: "Matlab agent bas ek model hai jo agla action choose karta hai aur tool use karta hai."
    progress: "Maine poora agent loop khud likha, around 150 lines of Python mein."
  - anchor: "Is laptop mein gaming ke time heating hoti hai aur performance drop ho jaati hai."
    repeat: "Jaise maine bola, game chalao toh garam ho jata hai aur speed kam ho jaati hai."
    progress: "Undervolt karne ke baad temperature assi degree ke neeche reh gaya."
  - anchor: "SIP mein har mahine thoda paisa invest karte ho, ek saath bada amount nahi."
    repeat: "Toh SIP ka matlab hai monthly chhota amount daalna, lump sum nahi."
    progress: "Dus saal tak paanch hazaar ki SIP se lagbhag das lakh ban sakte hain."
  - anchor: "Bread isliye dense bani kyunki dough ko rise hone ka time nahi mila."
    repeat: "Phir se bolu toh dough ko proper rise nahi hone diya isliye bread bhaari ho gayi."
    progress: "Agli baar main yeast ke saath thodi cheeni daalunga aur bowl garam jagah rakhunga."
  - anchor: "Formula ratne ki jagah samjho ki wo aata kahan se hai."
    repeat: "Formulas mug up mat karo, derivation samajh loge toh kabhi nahi bhoologe."
    progress: "Chalo circle ka area chhote triangles mein kaat ke nikalte hain."
  - anchor: "Hum sunrise se thoda pehle hi summit pe pahunch gaye the."
    repeat: "Suraj nikalne se bas kuch minute pehle hum top pe the."
    progress: "Neeche aate waqt raasta kaafi slippery tha aur do ghante zyada lage."
  - anchor: "Battery poora din chal jaati hai, heavy use mein bhi saat ghante screen time milta hai."
    repeat: "Heavy use karo tab bhi battery aaram se ek din nikal deti hai."
    progress: "Full charge hone mein lagbhag chaalis minute lagte hain."
  - anchor: "Booking form fail ho raha tha kyunki model date galat format mein type kar raha tha."
    repeat: "Date ka format galat jaa raha tha isliye form submit hi nahi ho raha tha."
    progress: "Prompt mein ek example daalne ke baad das mein se nau booking chal gayi."
  - anchor: "Subah jaldi uthne se padhai ke liye shaant time mil jaata hai."
    repeat: "Jaldi uthoge toh bina disturbance ke padhne ka time milega."
    progress: "Main har pachees minute padhne ke baad paanch minute ka break leta hoon."

hinglish_deva:
  - anchor: "डेलाइट में तीनों फोन्स की फोटोज़ काफी अच्छी आती हैं, कलर्स नेचुरल हैं।"
    repeat: "यार दिन में तो तीनों फोन अच्छी फोटो लेते हैं, कलर्स भी नेचुरल लगते हैं।"
    progress: "लो लाइट में पहले फोन की फोटो में बहुत ज़्यादा नॉइज़ आता है।"
  - anchor: "एजेंट बेसिकली एक प्रोग्राम है जो लैंग्वेज मॉडल से डिसाइड करता है कि नेक्स्ट स्टेप क्या होगा।"
    repeat: "मतलब एजेंट बस एक मॉडल है जो अगला एक्शन चूज़ करता है और टूल यूज़ करता है।"
    progress: "मैंने पूरा एजेंट लूप खुद लिखा, अराउंड डेढ़ सौ लाइन्स ऑफ पाइथन में।"
  - anchor: "इस लैपटॉप में गेमिंग के टाइम हीटिंग होती है और परफॉर्मेंस ड्रॉप हो जाती है।"
    repeat: "जैसे मैंने बोला, गेम चलाओ तो गरम हो जाता है और स्पीड कम हो जाती है।"
    progress: "अंडरवोल्ट करने के बाद टेम्परेचर अस्सी डिग्री के नीचे रह गया।"
  - anchor: "बुकिंग फॉर्म फेल हो रहा था क्योंकि मॉडल डेट गलत फॉर्मेट में टाइप कर रहा था।"
    repeat: "डेट का फॉर्मेट गलत जा रहा था इसलिए फॉर्म सबमिट ही नहीं हो रहा था।"
    progress: "प्रॉम्प्ट में एक एग्ज़ाम्पल डालने के बाद दस में से नौ बुकिंग चल गई।"

