[project]
name = "dropzero"
version = "0.3.0"
description = "DROPZERO: pre-publish audience retention simulator"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends()/File() in defaults

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-m 'not gpu and not model'"
markers = [
  "gpu: needs a CUDA GPU, faster-whisper weights and recorded audio clips (opt-in: pytest -m gpu)",
  "model: needs the local embedding model weights (opt-in: pytest -m model)",
]
