# Local LLM for flag explanations and rewrites. Open licence, runs on this machine.
# Qwen3-1.7B: Apache-2.0, multilingual (incl. Hindi), ~3.4 GB in fp16.
model: Qwen/Qwen3-1.7B
max_new_tokens: 260
# Greedy decoding: same evidence -> same text.
do_sample: false
excerpt_chars: 500
retries: 1
# "Rewrite this section": tighten flagged lines (checked: no new numbers, shorter, same script).
rewrite:
  max_chars: 900
  min_words: 12          # below this there is nothing worth rewriting
  max_ratio: 0.8         # rewrite must be at most 80% of the original word count
  retries: 1
  min_ratio: 0.35        # ...and at least 35% of it (over-compressed rewrites drop content)
  script_tolerance: 0.35 # rewrite's Devanagari share within this of the original lines'
  # Meaning check: LaBSE cosine similarity between original and rewrite. Provisional value, set on
  # 7 hand-checked EN/Hinglish/Hindi examples (garbled or meaning-losing rewrites scored 0.52-0.69,
  # good ones 0.73-0.97). Re-check on real transcripts.
  min_similarity: 0.70
