# Step 6 drop-off detector: evidence rules + model risk. Rule thresholds are NOT validated against
# retention data (the lecture data showed little effect of repetition); they are evidence checks
# for the problem-statement causes, labelled "rule-based" in the API and UI.

promise:
  # Title vs each sentence (LaBSE cosine). A sentence "addresses the title" at or above this.
  # Benchmark: same-point pairs averaged 0.54–0.73, unrelated 0.10–0.37 (docs/embedding_benchmark.md).
  mention_threshold: 0.45
  min_title_words: 3         # shorter titles (e.g. a file name) carry no checkable promise
  late_after_s: 30.0          # title promise first addressed after this -> flag
  high_after_s: 60.0

hook:
  window_s: 30.0              # the hook = the first 30 s
  lead_silence_s: 5.0         # no speech for this long at the start -> flag
  filler_ratio: 0.06          # fillers per word in the hook window

repetition:
  # Segment-level similarity to material >= 20 s earlier. 0.60 sits between the benchmark's mean
  # same-point similarity (0.54–0.73) and its highest same-topic-new-information pair (0.61).
  flag_threshold: 0.60
  high_threshold: 0.70
  # ...and above this quantile of THIS video's own segment similarities (a single-topic
  # lecture is similar to itself everywhere; only its outliers are repeats)
  video_quantile: 0.90
  max_flags: 5

low_information:
  # information_gain below this for at least min_run_s of consecutive speech
  gain_threshold: 0.35
  video_quantile: 0.20      # ...and below this quantile of the video's own gain
  min_run_s: 24.0

pacing:
  slow_ratio: 0.70            # words/sec below 70% of this video's own median
  min_segment_s: 5.0          # never judge pace on tiny segments

silence:
  mid_video_silence_s: 6.0    # consecutive no-speech time this long after the intro
  music_led_speech_share: 0.4 # below this share of speech, silence may be the format
  dead_air_silence_ratio: 0.6 # audio itself silent for >= this share -> dead air
  music_min_s: 45.0           # music/visuals without speech: flag only this long
  speech_silence_ratio: 0.5   # >= half of a speech segment is silence

visual:
  static_s: 20.0              # longest unchanging picture inside a segment
  since_cut_s: 60.0           # no scene cut for this long

model:
  # A segment the model rates "high" with no rule evidence still becomes a medium flag:
  # "model-estimated drop risk, no single clear cause".
  flag_model_only: true

cuts:
  snap_window_s: 1.5          # move cut points into the nearest pause between words

delivery:
  # Extra evidence bullets on flags (never a flag by themselves; NOT validated against retention).
  flat_pitch_ratio: 0.6       # segment pitch range below 60% of this video's typical range
  pause_s: 1.5                # longest gap between words inside the flagged range
  # repeated exact phrases are added to these categories only (topic terms repeat everywhere)
  phrase_categories: [repetition, low_information, pacing, model_risk]
  # on-screen content (CLIP): picture matches the words less than this share of the video's median
  weak_visual_match_ratio: 0.8
  visual_match_categories: [low_information, repetition, pacing, model_risk, visual_monotony]
