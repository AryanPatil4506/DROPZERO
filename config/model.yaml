# Retention-risk model (Step 5). Changing anything here changes the model version hash.
model:
  max_iter: 300
  learning_rate: 0.05
  max_leaf_nodes: 15
  min_samples_leaf: 40
  l2_regularization: 1.0
  random_state: 0
  # band = empirical quantiles of (actual - calibrated) retention on TRAIN, by position
  band_quantiles: [0.1, 0.9]
  band_bins: 10

# Direction constraints (research priors: Guo et al. 2014 - engagement rises with speaking
# rate; repetition and low new information are the problem statement's drop causes).
# +1 = can only raise the drop rate, -1 = can only lower it.
monotonic:
  repetition_similarity: 1
  repeated_sentence_ratio: 1
  repetition_count: 1
  semantic_novelty: -1
  information_gain: -1
  novelty_prev3_mean: -1
  gain_prev3_mean: -1
  pace_ratio: -1

baseline:
  position_bins: 20               # category-average curve: mean hazard by relative position

detection:
  # A "major drop" in the actual data: a non-first segment losing at least this share of the
  # viewers it started with. The intro drop is excluded because position alone predicts it.
  major_drop_hazard: 0.05
  tolerance_s: 10.0
  # Predicted-drop threshold is picked on TRAIN lectures only (best F1), never on test.

risk_levels:
  # Creator-facing risk from predicted hazard, as quantiles of non-first TRAIN predictions.
  high_quantile: 0.90
  medium_quantile: 0.75
