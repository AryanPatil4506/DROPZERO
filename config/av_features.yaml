# Phase 4 audio + visual features. Changes to definitions must bump AV_FEATURE_SCHEMA_VERSION.

visual:
  # Frames are sampled by ffmpeg as tiny grayscale images: cheap, deterministic, enough to see
  # cuts and motion. Not enough for content understanding (that is a later phase).
  sample_fps: 2.0
  width: 64
  height: 36
  # A scene cut: mean absolute frame difference (0..1) above cut_threshold AND at least
  # cut_vs_local_median times the median difference of the surrounding window (so steady camera
  # motion is not counted as a cut).
  cut_threshold: 0.12
  cut_vs_local_median: 3.0
  local_window_s: 5.0
  min_cut_gap_s: 1.0
  # Below this mean frame difference the picture counts as static (talking head on a tripod,
  # slide held on screen).
  static_threshold: 0.012

audio:
  frame_ms: 25
  hop_ms: 10
  # Silence = frame energy more than this many dB below the video's 95th-percentile frame energy,
  # i.e. relative to this video's own loudness, not an absolute level.
  silence_db_below_p95: 35.0
  # Energy is supporting evidence only: low energy is not "boring".

pitch:
  # YIN F0 tracking (backend/app/features/audio/pitch.py). 70-400 Hz covers adult speaking voices.
  frame_ms: 40
  hop_ms: 20
  fmin_hz: 70
  fmax_hz: 400
  threshold: 0.15          # CMND dip below this = a clear period (YIN paper's usual value)
  batch_frames: 2048       # memory only; does not change results
  smooth_frames: 5         # median filter against single-frame octave jumps
  # A segment's range (p90 - p10, semitones) is measured only on this much voiced speech.
  min_voiced_s: 2.0

content:
  # What is on screen (backend/app/features/visual/content.py). CLIP zero-shot over a fixed list,
  # local open weights. Evidence only: the retention model was trained without frames.
  enabled: true
  image_model: clip-ViT-B-32
  text_model: sentence-transformers/clip-ViT-B-32-multilingual-v1
  sample_fps: 1.0
  size: 224
  temperature: 100.0          # CLIP's logit scale
  min_confidence: 0.35        # below this a frame is "unclear"
  min_run_s: 3.0              # timeline runs shorter than this merge into the previous run
  types:
    - key: slide_text
      label: Slide with text
      prompts: ["a presentation slide with text", "a slide with bullet points", "a page of text on a screen"]
    - key: diagram
      label: Diagram
      prompts: ["a diagram with boxes and arrows", "a flowchart", "a sketch on a whiteboard", "a presenter explaining a diagram drawn on a board", "a teacher drawing on a glass lightboard"]
    - key: chart
      label: Chart or table
      prompts: ["a chart or graph", "a bar chart", "a table of numbers"]
    - key: screen
      label: Screen recording or code
      prompts: ["computer code on a screen", "a screen recording of software", "a website on a computer screen"]
    - key: talking_head
      label: Person talking to camera
      prompts: ["a person talking to the camera", "a close-up of a person speaking", "a presenter in a room"]
    - key: broll
      label: Footage or photo
      prompts: ["outdoor video footage", "a photo of an object", "a product shown close up"]
    - key: blank
      label: Blank or title card
      prompts: ["a plain black screen", "an empty background", "a title card with one large word"]
